
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <style>
    body {
      background: #10101c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    h1 { color: #8b7bff; font-size: 42px; }
    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }
    .game {
      background: #222238;
      padding: 30px;
      border-radius: 15px;
      width: 180px;
    }
    a { color: #a99cff; }
  </style>
</head>
<body>
  <h1>🎮 Game Hub</h1>
  <p>Welcome to Game Hub!</p>
  <div class="games">
    <div class="game">
      <h2>Game 1</h2>
      <p>Coming soon!</p>
    </div>
    <div class="game">
      <h2>Game 2</h2>
      <p>Coming soon!</p>
    </div>
    <div class="game">
      <h2>Game 3</h2>
      <p>Coming soon!</p>
    </div>
  </div>
</body>
</html>
